<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mercado House Ledger</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2B2A28" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Mercado Ledger" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F5F1E8;
    color: #2B2A28;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  #root { min-height: 100%; }
  input[type="date"], input[type="text"], input[type="number"], input[type="password"] {
    font-family: 'Source Serif 4', Georgia, serif;
  }
  ::placeholder { color: #A39C8C; opacity: 1; }
  button { font-family: 'Source Serif 4', Georgia, serif; }
  .tab-btn:focus-visible, .add-btn:focus-visible, .del-btn:focus-visible, .link-btn:focus-visible {
    outline: 2px solid #2B2A28;
    outline-offset: 2px;
  }
  .tab-btn, .add-btn, .del-btn, .link-btn, .primary-btn, .danger-btn {
    font: inherit;
  }
  svg.icon { display: block; flex-shrink: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------- */
  /* Icons (inline SVG, lucide-style outline icons)                    */
  /* ---------------------------------------------------------------- */
  function icon(paths, size, color, strokeWidth) {
    size = size || 18;
    color = color || "currentColor";
    strokeWidth = strokeWidth || 1.75;
    return (
      '<svg class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" ' +
      'fill="none" stroke="' + color + '" stroke-width="' + strokeWidth + '" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>'
    );
  }

  var ICONS = {
    sprout: '<path d="M7 20h10"/><path d="M10 20c0-4.4-3.6-7-7-7 0 4 3.6 7 7 7Z"/><path d="M14 20c0-6 4-9 7-9 0 5-3 9-7 9Z"/><path d="M10 20V10"/>',
    hardHat: '<path d="M2 18h20"/><path d="M10 4a8 8 0 0 0-8 8v6h16v-6a8 8 0 0 0-8-8Z"/><path d="M10 4V2"/><path d="M4 14h16"/>',
    zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    droplet: '<path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12Z"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 1 0-5.6 5.6l-6.2 6.2a1.5 1.5 0 0 0 2.1 2.1l6.2-6.2a4 4 0 0 0 5.6-5.6l-2.5 2.5-2-2Z"/>',
    banknote: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v.01"/><path d="M18 14v.01"/>',
    trash2: '<path d="M4 6h16"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    bookOpen: '<path d="M2 4.5c2-1 4.5-1.5 6.5-1V19c-2-.5-4.5 0-6.5 1V4.5Z"/><path d="M22 4.5c-2-1-4.5-1.5-6.5-1V19c2-.5 4.5 0 6.5 1V4.5Z"/>',
    layoutDashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    rotateCcw: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/>',
    wallet: '<path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 9h15a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H3"/><circle cx="16" cy="13" r="1"/>'
  };

  /* ---------------------------------------------------------------- */
  /* Data model                                                        */
  /* ---------------------------------------------------------------- */
  var STORAGE_KEY = "mercado-ledger-entries";

  var PANELS = [
    {
      id: "edwin", label: "Edwin", sub: "Grass trimming & uprooting",
      icon: ICONS.sprout, accent: "#5B7A52", accentSoft: "#E9EFE4",
      fields: [
        { key: "date", label: "Date", type: "date" },
        { key: "desc", label: "Work done", type: "text", placeholder: "e.g. Trimmed front lawn, uprooted weeds along fence" },
        { key: "amount", label: "Amount paid", type: "number" },
        { key: "advance", label: "Cash advance", type: "checkbox" }
      ]
    },
    {
      id: "bombet", label: "Bombet", sub: "Caretaker",
      icon: ICONS.hardHat, accent: "#A8752F", accentSoft: "#F3EADA",
      fields: [
        { key: "date", label: "Date", type: "date" },
        { key: "desc", label: "For", type: "text", placeholder: "e.g. Monthly caretaker pay, gate repair labor" },
        { key: "amount", label: "Amount paid", type: "number" },
        { key: "advance", label: "Cash advance", type: "checkbox" }
      ]
    },
    {
      id: "pelco", label: "PELCO", sub: "Electricity bill",
      icon: ICONS.zap, accent: "#3A5A8C", accentSoft: "#E4EAF3",
      fields: [
        { key: "date", label: "Date paid", type: "date" },
        { key: "period", label: "Billing period", type: "text", placeholder: "e.g. Aug 2026" },
        { key: "amount", label: "Amount", type: "number" },
        { key: "orNo", label: "OR No.", type: "text" }
      ]
    },
    {
      id: "bwsi", label: "BWSI", sub: "Water bill",
      icon: ICONS.droplet, accent: "#2E7D74", accentSoft: "#E1EFEC",
      fields: [
        { key: "date", label: "Date paid", type: "date" },
        { key: "period", label: "Billing period", type: "text", placeholder: "e.g. Aug 2026" },
        { key: "amount", label: "Amount", type: "number" },
        { key: "orNo", label: "OR No.", type: "text" }
      ]
    },
    {
      id: "maintenance", label: "Maintenance", sub: "Other house repairs",
      icon: ICONS.wrench, accent: "#8C4A3B", accentSoft: "#F3E4E0",
      fields: [
        { key: "date", label: "Date", type: "date" },
        { key: "desc", label: "Description", type: "text", placeholder: "e.g. Roof leak repair, paint touch-up" },
        { key: "amount", label: "Amount", type: "number" },
        { key: "doneBy", label: "Done by", type: "text", placeholder: "e.g. Name of worker/contractor" }
      ]
    },
    {
      id: "cash", label: "Cash Received", sub: "Funds received from owner",
      icon: ICONS.banknote, accent: "#3D7A4E", accentSoft: "#E3EFE3", isIncome: true,
      fields: [
        { key: "date", label: "Date", type: "date" },
        { key: "desc", label: "Received from / for", type: "text", placeholder: "e.g. Mercado family, house fund" },
        { key: "amount", label: "Amount", type: "number" },
        { key: "txnRef", label: "Transaction Ref. No.", type: "text", placeholder: "e.g. GCash / bank ref no." }
      ]
    }
  ];

  var ADMIN = {
    id: "admin", label: "Admin", sub: "Users & data management",
    icon: ICONS.layoutDashboard, accent: "#4A4A48", accentSoft: "#E8E6E1"
  };

  var HISTORY = {
    id: "history", label: "History", sub: "All transactions",
    icon: ICONS.history, accent: "#5C5546", accentSoft: "#ECE8DD"
  };

  var CASH_ADVANCE = {
    id: "cashadvance", label: "Cash Advance", sub: "Edwin & Bombet balances",
    icon: ICONS.wallet, accent: "#7A5C3A", accentSoft: "#F0E7D8"
  };

  function panelById(id) {
    for (var i = 0; i < PANELS.length; i++) if (PANELS[i].id === id) return PANELS[i];
    return null;
  }

  function emptyData() {
    var d = {};
    PANELS.forEach(function (p) { d[p.id] = []; });
    return d;
  }

  function peso(n) {
    var num = Number(n) || 0;
    return "\u20B1" + num.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ---------------------------------------------------------------- */
  /* State                                                              */
  /* ---------------------------------------------------------------- */
  var state = {
    data: emptyData(),
    activeId: "edwin",
    loading: true,
    loadError: false,
    saveError: false,
    form: { date: todayISO() },
    authed: false,
    showLoginModal: false,
    authForm: {},
    authError: "",
    loggedInUser: "",
    loggedInRole: "admin",
    newUserForm: {},
    newUserError: "",
    editingUsername: null,
    editPasswordForm: {},
    editPasswordError: ""
  };

  /* ---------------------------------------------------------------- */
  /* Supabase config                                                    */
  /* ---------------------------------------------------------------- */
  var SUPABASE_URL = "https://waqasikughpmplywnrah.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhcWFzaWt1Z2hwbXBseXducmFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTY0NzIsImV4cCI6MjEwNDkzMjQ3Mn0.dg6HqZXOkamps0VZi7hB8AUhQPEoO5LwlgJkSIue_c4";
  var LEDGER_ROW_ID = "mercado-house";
  var REST_URL = SUPABASE_URL + "/rest/v1/ledger_data";

  function supabaseHeaders(extra) {
    var headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    };
    if (extra) Object.assign(headers, extra);
    return headers;
  }

  function loadData() {
    fetch(REST_URL + "?id=eq." + encodeURIComponent(LEDGER_ROW_ID) + "&select=payload", {
      method: "GET",
      headers: supabaseHeaders()
    })
      .then(function (res) {
        if (!res.ok) throw new Error("Failed to load");
        return res.json();
      })
      .then(function (rows) {
        if (rows && rows[0] && rows[0].payload) {
          state.data = Object.assign(emptyData(), rows[0].payload);
        }
      })
      .catch(function () {
        state.loadError = true;
      })
      .then(function () {
        state.loading = false;
        render();
      });
  }

  function persist(next) {
    state.data = next;
    render();
    fetch(REST_URL + "?id=eq." + encodeURIComponent(LEDGER_ROW_ID), {
      method: "PATCH",
      headers: supabaseHeaders({ "Prefer": "return=minimal" }),
      body: JSON.stringify({ payload: next, updated_at: new Date().toISOString() })
    })
      .then(function (res) {
        state.saveError = !res.ok;
        render();
      })
      .catch(function () {
        state.saveError = true;
        render();
      });
  }

  /* ---------------------------------------------------------------- */
  /* Actions                                                            */
  /* ---------------------------------------------------------------- */
  function setActive(id) {
    state.activeId = id;
    state.form = { date: todayISO() };
    render();
  }

  function updateForm(key, value) {
    state.form[key] = value;
  }

  function addEntry() {
    if (!isAdmin()) return;
    var amt = state.form.amount;
    if (!amt || Number(amt) <= 0) return;
    var entry = Object.assign({ id: Date.now().toString(36) }, state.form);

    var isPersonPanel = (state.activeId === "edwin" || state.activeId === "bombet");
    if (isPersonPanel) {
      if (entry.advance) {
        delete entry.desc;
      } else {
        var currentBalance = computeCashAdvanceBalance(state.activeId);
        if (currentBalance > 0) {
          entry.appliedToAdvance = true;
        }
      }
    }

    var next = Object.assign({}, state.data);
    next[state.activeId] = [entry].concat(state.data[state.activeId]);
    state.form = { date: todayISO() };
    persist(next);
  }

  function isAdmin() {
    return state.authed && state.loggedInRole === "admin";
  }

  function removeEntry(catId, id) {
    if (!isAdmin()) return;
    var next = Object.assign({}, state.data);
    next[catId] = state.data[catId].filter(function (e) { return e.id !== id; });
    persist(next);
  }

  function resetAll() {
    if (!isAdmin()) return;
    var ok = window.confirm(
      "This will permanently delete every entry in every category. This cannot be undone. Continue?"
    );
    if (ok) persist(emptyData());
  }

  function saveCredentials() {
    var username = state.authForm.username;
    var password = state.authForm.password;
    if (!username || !password) {
      state.authError = "Enter a username and password.";
      render();
      return;
    }
    if (password !== state.authForm.confirm) {
      state.authError = "Passwords don't match.";
      render();
      return;
    }
    var next = Object.assign({}, state.data, { adminUsers: [{ username: username, password: password, role: "admin" }] });
    state.loggedInUser = username;
    state.loggedInRole = "admin";
    state.authed = true;
    state.showLoginModal = false;
    state.authForm = {};
    state.authError = "";
    persist(next);
  }

  function login() {
    var users = state.data.adminUsers || [];
    var username = state.authForm.username;
    var password = state.authForm.password;
    var match = null;
    for (var i = 0; i < users.length; i++) {
      if (users[i].username === username && users[i].password === password) { match = users[i]; break; }
    }
    if (match) {
      state.loggedInUser = match.username;
      state.loggedInRole = match.role || "admin";
      state.authed = true;
      state.showLoginModal = false;
      state.authForm = {};
      state.authError = "";
    } else {
      state.authError = "Incorrect username or password.";
    }
    render();
  }

  function addUser() {
    if (!isAdmin()) return;
    var users = state.data.adminUsers || [];
    var username = state.newUserForm.username;
    var password = state.newUserForm.password;
    var role = state.newUserForm.role === "admin" ? "admin" : "viewer";
    if (!username || !password) {
      state.newUserError = "Enter a username and password.";
      render();
      return;
    }
    if (password !== state.newUserForm.confirm) {
      state.newUserError = "Passwords don't match.";
      render();
      return;
    }
    var taken = users.some(function (u) { return u.username.toLowerCase() === username.toLowerCase(); });
    if (taken) {
      state.newUserError = "That username is already taken.";
      render();
      return;
    }
    var next = Object.assign({}, state.data, { adminUsers: users.concat([{ username: username, password: password, role: role }]) });
    state.newUserForm = {};
    state.newUserError = "";
    persist(next);
  }

  function removeUser(username) {
    if (!isAdmin()) return;
    var users = state.data.adminUsers || [];
    if (users.length <= 1) {
      window.alert("You can't remove the last remaining admin user.");
      return;
    }
    if (username === state.loggedInUser) {
      window.alert("You can't remove the account you're currently logged in as.");
      return;
    }
    var ok = window.confirm('Remove admin user "' + username + '"?');
    if (ok) {
      var next = Object.assign({}, state.data, {
        adminUsers: users.filter(function (u) { return u.username !== username; })
      });
      persist(next);
    }
  }

  function startEditPassword(username) {
    if (!isAdmin()) return;
    state.editingUsername = username;
    state.editPasswordForm = {};
    state.editPasswordError = "";
    render();
  }

  function cancelEditPassword() {
    state.editingUsername = null;
    state.editPasswordForm = {};
    state.editPasswordError = "";
    render();
  }

  function saveEditPassword() {
    if (!isAdmin() || !state.editingUsername) return;
    var password = state.editPasswordForm.password;
    var confirm = state.editPasswordForm.confirm;
    if (!password) {
      state.editPasswordError = "Enter a new password.";
      render();
      return;
    }
    if (password !== confirm) {
      state.editPasswordError = "Passwords don't match.";
      render();
      return;
    }
    var users = state.data.adminUsers || [];
    var username = state.editingUsername;
    var next = Object.assign({}, state.data, {
      adminUsers: users.map(function (u) {
        return u.username === username ? { username: u.username, password: password } : u;
      })
    });
    state.editingUsername = null;
    state.editPasswordForm = {};
    state.editPasswordError = "";
    persist(next);
  }

  /* ---------------------------------------------------------------- */
  /* Derived values                                                     */
  /* ---------------------------------------------------------------- */
  function computeTotals() {
    var t = {};
    PANELS.forEach(function (p) {
      t[p.id] = state.data[p.id].reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
    });
    var cashImpact = {};
    PANELS.forEach(function (p) {
      cashImpact[p.id] = state.data[p.id].reduce(function (s, e) {
        if (e.appliedToAdvance) return s;
        return s + (Number(e.amount) || 0);
      }, 0);
    });
    var expenses = PANELS.filter(function (p) { return !p.isIncome; })
      .reduce(function (s, p) { return s + cashImpact[p.id]; }, 0);
    var income = t.cash || 0;
    t.expenses = expenses;
    t.income = income;
    t.balance = income - expenses;
    return t;
  }

  function computeCashAdvanceBalance(personId) {
    var entries = state.data[personId] || [];
    var given = entries.filter(function (e) { return e.advance; })
      .reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
    var applied = entries.filter(function (e) { return e.appliedToAdvance; })
      .reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
    return given - applied;
  }

  function computeAllEntries() {
    var rows = [];
    PANELS.forEach(function (p) {
      state.data[p.id].forEach(function (e) {
        var row = Object.assign({}, e);
        row._panel = p;
        rows.push(row);
      });
    });
    rows.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    return rows;
  }

  /* ---------------------------------------------------------------- */
  /* Rendering                                                          */
  /* ---------------------------------------------------------------- */
  var root = document.getElementById("root");

  function render() {
    var html = "";

    if (state.loading) {
      html = renderLoadingScreen();
    } else if (!state.authed) {
      html = renderGate();
    } else {
      var totals = computeTotals();
      if (state.activeId === "admin" && !isAdmin()) {
        state.activeId = "edwin";
      }
      var active = state.activeId === "admin" ? ADMIN : (state.activeId === "history" ? HISTORY : (state.activeId === "cashadvance" ? CASH_ADVANCE : panelById(state.activeId)));

      html += renderHeader();
      html += renderBalanceStrip(totals);
      html += '<div style="display:flex;align-items:stretch;">';
      html += renderRail(active);
      html += '<div style="flex:1;min-width:0;padding:16px 18px 40px;">';
      html += renderPanelHeading(active);

      if (state.activeId === "admin") {
        html += renderAdmin(totals);
      } else if (state.activeId === "history") {
        html += renderHistory(totals);
      } else if (state.activeId === "cashadvance") {
        html += renderCashAdvance();
      } else {
        html += renderEntryPanel(active, totals);
      }

      html += '</div>'; // active panel
      html += '</div>'; // body flex
    }

    root.innerHTML = html;
    attachHandlers();
  }

  function renderLoadingScreen() {
    return (
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">' +
        '<div style="font-size:13px;color:#7A7264;">Loading\u2026</div>' +
      '</div>'
    );
  }

  function renderGate() {
    var users = state.data.adminUsers || [];
    var isSetup = users.length === 0;

    var html = (
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;">' +
        '<div style="width:100%;max-width:340px;">' +
          '<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;">' +
            icon(ICONS.bookOpen, 24, "#2B2A28", 1.5) +
            '<div style="font-size:18px;font-weight:600;color:#2B2A28;">Mercado House Ledger</div>' +
          '</div>' +
          '<div style="background:#FFFFFF;border:1px solid #E4DDCB;border-radius:12px;padding:18px;">'
    );

    if (isSetup) {
      html += (
        '<div style="font-size:14px;font-weight:700;margin-bottom:4px;">Set up access</div>' +
        '<div style="font-size:12.5px;color:#7A7264;margin-bottom:14px;">Choose a username and password to protect this ledger.</div>' +
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:12px;color:#7A7264;margin-bottom:4px;">Username</label>' +
          textInput({ key: "username", scope: "auth", type: "text", value: state.authForm.username }) +
        '</div>' +
        '<div style="margin-bottom:10px;"><label style="display:block;font-size:12px;color:#7A7264;margin-bottom:4px;">Password</label>' +
          textInput({ key: "password", scope: "auth", type: "password", value: state.authForm.password }) +
        '</div>' +
        '<div style="margin-bottom:14px;"><label style="display:block;font-size:12px;color:#7A7264;margin-bottom:4px;">Confirm password</label>' +
          textInput({ key: "confirm", scope: "auth", type: "password", value: state.authForm.confirm }) +
        '</div>' +
        (state.authError ? '<div style="font-size:12px;color:#8C4A3B;margin-bottom:10px;">' + escapeHtml(state.authError) + '</div>' : '') +
        '<button data-action="save-credentials" style="width:100%;padding:10px;border-radius:8px;border:none;background:' + ADMIN.accent + ';color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer;">Save &amp; continue</button>'
      );
    } else {
      html += (
        '<div style="font-size:14px;font-weight:700;margin-bottom:4px;">Log in</div>' +
        '<div style="font-size:12.5px;color:#7A7264;margin-bottom:14px;">Enter your username and password to continue.</div>' +

  function renderHistory(totals) {
    var html = '<div style="margin-top:14px;">';

    PANELS.forEach(function (p) {
      html += (
        '<div style="background:#FFFFFF;border:1px solid #E4DDCB;border-left:4px solid ' + p.accent + ';border-radius:8px;padding:10px 12px;">' +
          '<div style="font-size:11.5px;color:#7A7264;">' + p.label + '</div>' +
          '<div style="font-size:15px;font-weight:700;color:' + p.accent + ';">' + peso(totals[p.id]) + '</div>' +
          '<div style="font-size:11px;color:#A39C8C;">' + state.data[p.id].length + ' entries</div>' +
        '</div>'
      );
    });
    html += '</div>';

    // Overall totals
    html += (
      '<div style="background:#2B2A28;color:#F5F1E8;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;margin-bottom:20px;">' +
        '<div><div style="font-size:11px;color:#B9B2A0;">Received</div><div style="font-size:15px;font-weight:600;">' + peso(totals.income) + '</div></div>' +

        '<div style="text-align:right;"><div style="font-size:11px;color:#B9B2A0;">Balance</div><div style="font-size:15px;font-weight:600;color:' + (totals.balance < 0 ? "#E2A29A" : "#CFE3C8") + ';">' + peso(totals.balance) + '</div></div>' +
      '</div>'
    );

    // Combined log
    html += '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">All transactions</div>';
    var allEntries = computeAllEntries();
    if (allEntries.length === 0) {
      html += '<div style="font-size:13px;color:#A39C8C;font-style:italic;">No entries recorded yet.</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:8px;">';
      allEntries.forEach(function (e) {
        html += (
          '<div style="background:#FFFFFF;border:1px solid #E4DDCB;border-left:4px solid ' + e._panel.accent + ';border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:11px;color:' + e._panel.accent + ';font-weight:700;">' + e._panel.label + ' \u00B7 ' + escapeHtml(e.date) + '</div>' +
              (e.desc ? '<div style="font-size:13.5px;margin-top:2px;">' + escapeHtml(e.desc) + '</div>' : '') +
              '<div style="font-size:14px;font-weight:700;margin-top:2px;color:' + e._panel.accent + ';">' + peso(e.amount) + '</div>' +
            '</div>' +
            (isAdmin() ?
              '<button class="del-btn" data-action="remove-entry" data-cat="' + e._panel.id + '" data-id="' + e.id + '" aria-label="Delete entry" style="border:none;background:transparent;cursor:pointer;padding:4px;color:#A39C8C;">' +
                icon(ICONS.trash2, 16) +
              '</button>'
              : '') +
          '</div>'
        );
      });
      html += '</div>';
    }

    html += '</div>'; // wrapper
    return html;
  }

  function renderCashAdvance() {
    var people = [panelById("edwin"), panelById("bombet")];
    var html = '<div style="margin-top:14px;">';

    people.forEach(function (person) {
      var entries = state.data[person.id].filter(function (e) { return e.advance || e.appliedToAdvance; })
        .slice()
        .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      var balance = computeCashAdvanceBalance(person.id);

      html += '<div style="margin-bottom:24px;">';
      html += (
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
          '<div style="font-size:15px;font-weight:700;color:' + person.accent + ';">' + person.label + '</div>' +
          '<div style="font-size:13px;color:#7A7264;">Outstanding: <strong style="color:' + person.accent + ';">' + peso(balance) + '</strong></div>' +
        '</div>'
      );

      if (entries.length === 0) {
        html += '<div style="font-size:13px;color:#A39C8C;font-style:italic;">No cash advance activity for ' + person.label + ' yet.</div>';
      } else {
        html += '<div style="display:flex;flex-direction:column;gap:8px;">';
        entries.forEach(function (e) {
          var isGiven = !!e.advance;
          html += (
            '<div style="background:#FFFFFF;border:1px solid #E4DDCB;border-left:4px solid ' + person.accent + ';border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">' +
              '<div style="flex:1;min-width:0;">' +
                '<div style="font-size:11px;color:' + person.accent + ';font-weight:700;">' + escapeHtml(e.date) + '</div>' +
                '<div style="font-size:13.5px;margin-top:2px;">' + (isGiven ? "Cash advance given" : "Payment applied to advance" + (e.desc ? " \u2014 " + escapeHtml(e.desc) : "")) + '</div>' +
                '<div style="font-size:14px;font-weight:700;margin-top:2px;color:' + (isGiven ? person.accent : "#5C7A5B") + ';">' + (isGiven ? "+ " : "\u2212 ") + peso(e.amount) + '</div>' +
              '</div>' +
              (isAdmin() ?
                '<button class="del-btn" data-action="remove-entry" data-cat="' + person.id + '" data-id="' + e.id + '" aria-label="Delete entry" style="border:none;background:transparent;cursor:pointer;padding:4px;color:#A39C8C;">' +
                  icon(ICONS.trash2, 16) +
                '</button>'
                : '') +
            '</div>'
          );
        });
        html += '</div>';
      }
      html += '</div>';
    });

    html += '</div>'; // wrapper
    return html;
  }


  function renderEntryPanel(active, totals) {
    var isPersonPanel = (active.id === "edwin" || active.id === "bombet");
    var caBalance = isPersonPanel ? computeCashAdvanceBalance(active.id) : 0;
    var hideDesc = isPersonPanel && state.form.advance;

    var html = "";
    html += (
      '<div style="font-size:13px;color:#2B2A28;margin:10px 0 16px;">' +
        'Total ' + (active.isIncome ? "received" : "spent") + ': <strong>' + peso(totals[active.id]) + '</strong>' +
      '</div>'
    );

    if (isPersonPanel && caBalance > 0) {
      html += (
        '<div style="background:' + active.accentSoft + ';border:1px solid ' + active.accent + '33;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:' + active.accent + ';">' +
          'Outstanding cash advance: <strong>' + peso(caBalance) + '</strong> \u2014 the next payment entered here will be deducted from this balance instead of Cash on Hand.' +
        '</div>'
      );
    }

    // Entry form
    if (isAdmin()) {
      html += '<div style="background:#FFFFFF;border:1px solid #E4DDCB;border-radius:12px;padding:14px;margin-bottom:18px;">';
      active.fields.forEach(function (f) {
        if (isPersonPanel && f.key === "desc" && hideDesc) return;
        html += '<div style="margin-bottom:10px;">';
        if (f.type === "checkbox") {
          html += (
            '<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#2B2A28;cursor:pointer;">' +
              '<input type="checkbox" data-field="' + f.key + '" data-scope="entry" data-rerender="true" ' + (state.form[f.key] ? "checked" : "") + ' ' +
              'style="width:16px;height:16px;accent-color:' + active.accent + ';" />' +
              f.label +
            '</label>'
          );
        } else {
          html += (
            '<label style="display:block;font-size:12px;color:#7A7264;margin-bottom:4px;">' + f.label + '</label>' +
            '<input type="' + f.type + '" placeholder="' + escapeHtml(f.placeholder || "") + '" data-field="' + f.key + '" data-scope="entry" ' +
            'value="' + escapeHtml(state.form[f.key] !== undefined ? state.form[f.key] : "") + '" ' +
            'style="width:100%;padding:9px 10px;border-radius:8px;border:1px solid #D8D0BC;font-size:14px;background:#FBFAF6;color:#2B2A28;" />'
          );
        }
        html += '</div>';
      });
      html += (
        '<button class="add-btn" data-action="add-entry" style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:8px;border:none;background:' + active.accent + ';color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;">' +
          icon(ICONS.plus, 16) + ' Add entry' +
        '</button>'
      );
      html += '</div>';
    }

    // Entries list
    var listEntries = state.data[active.id];

    if (state.loading) {
      html += '<div style="font-size:13px;color:#7A7264;">Loading entries\u2026</div>';
    } else if (listEntries.length === 0) {
      html += '<div style="font-size:13px;color:#A39C8C;font-style:italic;">No entries yet for ' + active.label + '.</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:8px;">';
      listEntries.forEach(function (e) {
        html += (
          '<div style="background:#FFFFFF;border:1px solid #E4DDCB;border-left:4px solid ' + active.accent + ';border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:12px;color:#7A7264;">' + escapeHtml(e.date) + '</div>' +
              (e.desc ? '<div style="font-size:14px;margin-top:2px;">' + escapeHtml(e.desc) + '</div>' : '') +
              (e.period ? '<div style="font-size:13px;margin-top:2px;">Period: ' + escapeHtml(e.period) + '</div>' : '') +
              (e.orNo ? '<div style="font-size:12px;color:#7A7264;">OR No.: ' + escapeHtml(e.orNo) + '</div>' : '') +
              (e.doneBy ? '<div style="font-size:12px;color:#7A7264;">Done by: ' + escapeHtml(e.doneBy) + '</div>' : '') +
              (e.advance ? '<span style="display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:' + active.accent + ';background:' + active.accentSoft + ';padding:2px 7px;border-radius:5px;">Cash advance given</span>' : '') +
              (e.appliedToAdvance ? '<span style="display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:' + active.accent + ';background:' + active.accentSoft + ';padding:2px 7px;border-radius:5px;">Applied to cash advance</span>' : '') +
              (e.txnRef ? '<div style="font-size:12px;color:#7A7264;">Txn Ref. No.: ' + escapeHtml(e.txnRef) + '</div>' : '') +
              '<div style="font-size:15px;font-weight:700;margin-top:4px;color:' + active.accent + ';">' + peso(e.amount) + '</div>' +
            '</div>' +
            (isAdmin() ?
              '<button class="del-btn" data-action="remove-entry" data-cat="' + active.id + '" data-id="' + e.id + '" aria-label="Delete entry" style="border:none;background:transparent;cursor:pointer;padding:4px;color:#A39C8C;">' +
                icon(ICONS.trash2, 16) +
              '</button>'
              : '') +
          '</div>'
        );
      });
      html += '</div>';
    }

    return html;
  }

  /* ---------------------------------------------------------------- */
  /* Event wiring                                                       */
  /* ---------------------------------------------------------------- */
  function scopeObj(scope) {
    if (scope === "auth") return state.authForm;
    if (scope === "newUser") return state.newUserForm;
    if (scope === "editPassword") return state.editPasswordForm;
    return state.form;
  }

  function attachHandlers() {
    // Tab navigation
    root.querySelectorAll("[data-goto]").forEach(function (btn) {
      btn.addEventListener("click", function () { setActive(btn.getAttribute("data-goto")); });
    });

    // Text/number/password/checkbox inputs (no full re-render on keystroke, to preserve focus)
    root.querySelectorAll("[data-field]").forEach(function (input) {
      var scope = input.getAttribute("data-scope");
      var field = input.getAttribute("data-field");
      var obj = scopeObj(scope);

      if (input.type === "checkbox") {
        input.addEventListener("change", function () {
          obj[field] = input.checked;
          if (input.getAttribute("data-rerender") === "true") {
            render();
          }
        });
      } else if (input.tagName === "SELECT") {
        input.addEventListener("change", function () {
          obj[field] = input.value;
        });
      } else {
        input.addEventListener("input", function () {
          obj[field] = input.value;
        });
      }

      if (input.getAttribute("data-enter") === "login") {
        input.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") login();
        });
      }
    });

    // Buttons
    bindAction("add-entry", addEntry);
    bindAction("save-credentials", saveCredentials);
    bindAction("login", login);
    bindAction("logout", function () {
      state.authed = false;
      state.loggedInUser = "";
      state.loggedInRole = "admin";
      state.activeId = "edwin";
      render();
    });
    bindAction("add-user", addUser);
    bindAction("reset-all", resetAll);
    bindAction("save-edit-password", saveEditPassword);
    bindAction("cancel-edit-password", cancelEditPassword);

    root.querySelectorAll('[data-action="start-edit-password"]').forEach(function (btn) {
      btn.addEventListener("click", function () { startEditPassword(btn.getAttribute("data-username")); });
    });

    root.querySelectorAll('[data-action="remove-user"]').forEach(function (btn) {
      btn.addEventListener("click", function () { removeUser(btn.getAttribute("data-username")); });
    });
    root.querySelectorAll('[data-action="remove-entry"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        removeEntry(btn.getAttribute("data-cat"), btn.getAttribute("data-id"));
      });
    });
  }

  function bindAction(name, fn) {
    var el = root.querySelector('[data-action="' + name + '"]');
    if (el) el.addEventListener("click", fn);
  }

  /* ---------------------------------------------------------------- */
  /* Init                                                               */
  /* ---------------------------------------------------------------- */
  render();
  loadData();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {
      /* ignore registration failures — app still works without it */
    });
  }
})();
</script>
</body>
</html>
